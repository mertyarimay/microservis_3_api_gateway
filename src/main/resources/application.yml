server:
  port: 8080

spring:
  application:
    name: api_gateway

  cloud:
    gateway:
      routes:


        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/product/api/**,
              /product/brand/api/**,
              /category/api/**,
              /category/title/api/**,
              /products/**


        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/api/**,
              /customer/api/**,
              /role/api/**,
              /users/roles/api/**

      
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/order/api/**,
              /order/item/api/**,
              /address/api/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    root: DEBUG
